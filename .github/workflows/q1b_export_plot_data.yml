name: q1b-export-plot-data

on:
  push:
    branches: [step03a-supplement-export]
    paths:
      - 'scripts/q1b_export_plot_data.py'
      - '.github/workflows/q1b_export_plot_data.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  export-step03a-plot-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1

      - name: Export frozen STEP03-A plot data
        run: |
          set -o pipefail
          python scripts/q1b_export_plot_data.py 2>&1 | tee step03a_supplement_run_output.txt

      - name: Upload STEP03-A supplemental freeze artifact
        uses: actions/upload-artifact@v4
        with:
          name: step03a-supplement-freeze
          path: |
            outputs/q1b_signal_mechanism_export/**
            step03a_supplement_run_output.txt
          if-no-files-found: error
          retention-days: 30
