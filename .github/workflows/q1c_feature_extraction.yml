name: q1c-step04-feature-extraction

on:
  push:
    branches: [main]
    paths:
      - 'scripts/q1c_feature_extraction.py'
      - '.github/workflows/q1c_feature_extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-q1c-step04:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1

      - name: Run Q1C STEP04
        run: |
          set -o pipefail
          mkdir -p outputs/q1c_feature_extraction
          python scripts/q1c_feature_extraction.py 2>&1 | tee outputs/q1c_feature_extraction/run_output.txt

      - name: Commit generated evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/q1c_feature_extraction
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add Q1C STEP04 feature extraction evidence [skip ci]'
            git push
          fi
