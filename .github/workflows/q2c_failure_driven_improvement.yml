name: q2c-step07-failure-driven-improvement

on:
  push:
    paths:
      - 'scripts/q2c_failure_driven_improvement.py'
      - '.github/workflows/q2c_failure_driven_improvement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-q2c-step07:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn joblib

      - name: Run Q2C STEP07
        run: |
          mkdir -p outputs/q2c_failure_driven_improvement
          python scripts/q2c_failure_driven_improvement.py | tee outputs/q2c_failure_driven_improvement/run_output.txt

      - name: Commit generated evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/q2c_failure_driven_improvement
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add Q2C STEP07 improvement evidence [skip ci]'
            git push
          fi
