name: q2c-step07-frozen2025

on:
  push:
    branches: [main]
    paths:
      - 'scripts/q2c_step07_frozen2025.py'
      - 'scripts/q2c_failure_driven_improvement.py'
      - '.github/workflows/q2c_step07_frozen2025.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-q2c-step07-frozen2025:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 joblib==1.4.2
      - name: Run clean STEP07 frozen-2025 evaluation
        run: |
          set -o pipefail
          rm -rf outputs/q2c_step07_frozen2025
          mkdir -p outputs/q2c_step07_frozen2025
          python scripts/q2c_step07_frozen2025.py 2>&1 | tee outputs/q2c_step07_frozen2025/run_output.txt
      - name: Commit generated evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/q2c_step07_frozen2025
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add clean Q2C STEP07 frozen-2025 evidence [skip ci]'
            git push
          fi
