name: q2c-step07-strict

on:
  push:
    branches: [main]
    paths:
      - 'scripts/q2c_step07_strict.py'
      - '.github/workflows/q2c_step07_strict.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-step07-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 joblib==1.4.2
      - name: Run strict STEP07
        run: |
          set -o pipefail
          rm -rf outputs/q2c_step07_strict
          mkdir -p outputs/q2c_step07_strict
          python scripts/q2c_step07_strict.py 2>&1 | tee outputs/q2c_step07_strict/run_output.txt
      - name: Commit evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/q2c_step07_strict
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add strict Q2C STEP07 evidence [skip ci]'
            git push
          fi
