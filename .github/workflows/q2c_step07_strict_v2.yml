name: q2c-step07-strict-v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/q2c_step07_strict_v2.py'
      - '.github/workflows/q2c_step07_strict_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-step07-strict-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.5.2 joblib==1.4.2
      - run: |
          set -o pipefail
          rm -rf outputs/q2c_step07_strict_v2
          mkdir -p outputs/q2c_step07_strict_v2
          python scripts/q2c_step07_strict_v2.py 2>&1 | tee outputs/q2c_step07_strict_v2/run_output.txt
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/q2c_step07_strict_v2
          if git diff --cached --quiet; then echo 'No generated changes'; else git commit -m 'Add strict v2 Q2C STEP07 evidence [skip ci]' && git push; fi
