name: q3a-step08-domain-diagnosis

on:
  push:
    paths:
      - 'scripts/q3a_domain_diagnosis.py'
      - '.github/workflows/q3a_domain_diagnosis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-q3a-step08:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn joblib matplotlib

      - name: Run Q3A STEP08
        run: |
          mkdir -p outputs/q3a_domain_diagnosis
          python scripts/q3a_domain_diagnosis.py | tee outputs/q3a_domain_diagnosis/run_output.txt

      - name: Commit generated evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/q3a_domain_diagnosis
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add Q3A STEP08 domain diagnosis evidence [skip ci]'
            git push
          fi
