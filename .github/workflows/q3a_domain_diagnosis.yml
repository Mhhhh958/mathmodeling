name: step08a-domain-diagnosis-current-freeze

on:
  push:
    paths:
      - 'protocol/08A/dispatch_token.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-step08a:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen 00-B environment
        run: |
          python -m pip install --upgrade pip
          pip install -r protocol/00B/requirements-lock-00b.txt

      - name: Run STEP08-A
        run: |
          python scripts/step08a_domain_diagnosis.py

      - name: Commit frozen evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/runs protocol/08A/latest_freeze_package.json protocol/08A/latest_run_id.txt protocol/08A/validation_record.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m '08-A: add domain diagnosis and no-transfer freeze [skip ci]'
            git push
          fi
