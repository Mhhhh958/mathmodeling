name: q3c-step10-final-labels-and-display

on:
  push:
    paths:
      - 'scripts/q3c_final_labels_and_display.py'
      - '.github/workflows/q3c_final_labels_and_display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-q3c-step10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn joblib matplotlib

      - name: Run Q3C STEP10
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/q3c_final_labels_and_display
          python scripts/q3c_final_labels_and_display.py | tee outputs/q3c_final_labels_and_display/run_output.txt

      - name: Commit generated evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/q3c_final_labels_and_display
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add Q3C STEP10 final label evidence [skip ci]'
            git push
          fi
