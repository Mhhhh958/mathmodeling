name: q4-step11-explainability

on:
  push:
    paths:
      - 'scripts/q4_explainability.py'
      - '.github/workflows/q4_explainability.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-q4-step11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn joblib matplotlib

      - name: Run Q4 STEP11
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/q4_explainability
          python scripts/q4_explainability.py | tee outputs/q4_explainability/run_output.txt

      - name: Commit generated evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/q4_explainability
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add Q4 STEP11 explainability evidence [skip ci]'
            git push
          fi
