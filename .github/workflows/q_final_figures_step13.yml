name: q-final-figures-step13

on:
  push:
    paths:
      - 'scripts/q_final_figures_step13.py'
      - '.github/workflows/q_final_figures_step13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-step13:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.9.1 joblib==1.6.0 matplotlib==3.9.2 pillow==12.3.0

      - name: Run STEP13 freeze
        shell: bash
        run: |
          set -o pipefail
          rm -rf outputs/final_figures_step13
          mkdir -p outputs/final_figures_step13
          python scripts/q_final_figures_step13.py | tee outputs/final_figures_step13/run_output.txt

      - name: Commit generated frozen assets
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/final_figures_step13
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add STEP13 frozen figures and answer assets [skip ci]'
            git push
          fi
