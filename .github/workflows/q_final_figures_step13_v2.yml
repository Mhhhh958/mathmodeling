name: q-final-figures-step13-v2

on:
  push:
    paths:
      - '.github/workflows/q_final_figures_step13_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-step13-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1 scikit-learn==1.9.1 joblib==1.6.0 matplotlib==3.9.2 pillow==12.3.0

      - name: Patch model-bundle loading in reproducible script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/q_final_figures_step13.py')
          s = p.read_text(encoding='utf-8')
          old = '''    pipe=joblib.load(Q2_FINAL_MODEL)\n    classes=list(pipe.named_steps["clf"].classes_)'''
          new = '''    model_bundle=joblib.load(Q2_FINAL_MODEL)\n    pipe=model_bundle["pipeline"] if isinstance(model_bundle, dict) else model_bundle\n    classes=list(pipe.named_steps["clf"].classes_)'''
          if old not in s:
              raise SystemExit('Expected patch target not found')
          s = s.replace(old, new, 1)
          # Matplotlib 3.9 compatibility cleanup; no data/logic change.
          s = s.replace('boxplot(data, labels=LABELS,', 'boxplot(data, tick_labels=LABELS,')
          s = s.replace('boxplot(vals,labels=groups,', 'boxplot(vals,tick_labels=groups,')
          s = s.replace('boxplot(vals2,labels=groups2,', 'boxplot(vals2,tick_labels=groups2,')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Run fixed STEP13 freeze
        shell: bash
        run: |
          set -o pipefail
          rm -rf outputs/final_figures_step13
          mkdir -p outputs/final_figures_step13
          python scripts/q_final_figures_step13.py | tee outputs/final_figures_step13/run_output.txt

      - name: Commit corrected script and frozen assets
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/q_final_figures_step13.py outputs/final_figures_step13
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add fixed STEP13 frozen figures and answer assets [skip ci]'
            git push
          fi
