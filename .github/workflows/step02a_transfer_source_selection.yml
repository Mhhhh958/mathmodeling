name: step02a-transfer-source-selection
on:
  push:
    branches: [main]
    paths:
      - 'scripts/step02a_transfer_source_selection.py'
      - 'protocol/02A/run_config.json'
      - 'protocol/02A/question1_argument_blueprint.json'
      - 'protocol/02A/code_manifest.json'
      - '.github/workflows/step02a_transfer_source_selection.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  select-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1
      - name: Run STEP02-A source selection
        run: python scripts/step02a_transfer_source_selection.py
      - name: Commit STEP02-A evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/runs protocol/02A/validation_record.json protocol/02A/latest_freeze_package.json protocol/02A/latest_run_id.txt
          if git diff --cached --quiet; then
            echo 'No STEP02-A evidence to commit.'
          else
            git commit -m 'Add STEP02-A source selection evidence [skip ci]'
            git push
          fi
