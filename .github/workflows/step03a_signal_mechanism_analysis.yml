name: step03a-signal-mechanism-analysis
on:
  push:
    branches: [main]
    paths:
      - 'scripts/step03a_signal_mechanism_analysis.py'
      - 'protocol/03A/run_config.json'
      - 'protocol/03A/question1B_argument_blueprint.json'
      - 'protocol/03A/problem_statement_mechanism_basis.json'
      - 'protocol/03A/code_manifest.json'
      - '.github/workflows/step03a_signal_mechanism_analysis.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1
      - name: Run STEP03-A mechanism analysis
        run: python scripts/step03a_signal_mechanism_analysis.py
      - name: Commit STEP03-A evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/runs protocol/03A
          if git diff --cached --quiet; then
            echo 'No STEP03-A evidence to commit.'
          else
            git commit -m 'Add STEP03-A signal mechanism evidence [skip ci]'
            git push
          fi
