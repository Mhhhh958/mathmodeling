name: step04a-window-feature-extraction
on:
  push:
    branches: [main]
    paths:
      - 'scripts/step04a_window_feature_extraction.py'
      - 'protocol/04A/run_config.json'
      - 'protocol/04A/question1C_argument_blueprint.json'
      - 'protocol/04A/code_manifest.json'
      - '.github/workflows/step04a_window_feature_extraction.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scipy==1.14.1
      - name: Run STEP04-A windowing and feature extraction
        run: python scripts/step04a_window_feature_extraction.py
      - name: Commit STEP04-A evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/runs protocol/04A
          if git diff --cached --quiet; then
            echo 'No STEP04-A evidence to commit.'
          else
            git commit -m 'Add STEP04-A window feature evidence [skip ci]'
            git push
          fi
