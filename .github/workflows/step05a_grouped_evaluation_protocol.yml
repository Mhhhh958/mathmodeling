name: step05a-grouped-evaluation-protocol
on:
  push:
    branches: [main]
    paths:
      - 'scripts/step05a_grouped_evaluation_protocol.py'
      - 'protocol/05A/run_config.json'
      - 'protocol/05A/question2_argument_blueprint.json'
      - 'protocol/05A/code_manifest.json'
      - '.github/workflows/step05a_grouped_evaluation_protocol.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.9.1
      - name: Run STEP05-A protocol freeze
        run: python scripts/step05a_grouped_evaluation_protocol.py
      - name: Commit STEP05-A evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/runs protocol/05A
          if git diff --cached --quiet; then
            echo 'No STEP05-A evidence to commit.'
          else
            git commit -m 'Add STEP05-A grouped evaluation evidence [skip ci]'
            git push
          fi
