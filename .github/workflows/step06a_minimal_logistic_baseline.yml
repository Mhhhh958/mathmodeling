name: step06a-minimal-logistic-baseline
on:
  push:
    branches: [main]
    paths:
      - 'scripts/step06a_minimal_logistic_baseline.py'
      - 'protocol/06A/run_config.json'
      - 'protocol/06A/code_manifest.json'
      - '.github/workflows/step06a_minimal_logistic_baseline.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.9.1 joblib==1.6.0
      - name: Run STEP06-A minimal baseline
        run: python scripts/step06a_minimal_logistic_baseline.py
      - name: Commit STEP06-A evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/runs protocol/06A
          if git diff --cached --quiet; then
            echo 'No STEP06-A evidence to commit.'
          else
            git commit -m 'Add STEP06-A minimal baseline evidence [skip ci]'
            git push
          fi
