name: step07a-failure-driven-improvement
on:
  push:
    branches: [main]
    paths:
      - 'scripts/step07a_failure_driven_improvement.py'
      - 'protocol/07A/run_config.json'
      - 'protocol/07A/question2C_argument_blueprint.json'
      - 'protocol/07A/code_manifest.json'
      - '.github/workflows/step07a_failure_driven_improvement.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.9.1 joblib==1.6.0
      - name: Run STEP07-A improvement experiments
        run: python scripts/step07a_failure_driven_improvement.py
      - name: Commit STEP07-A evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/runs protocol/07A
          if git diff --cached --quiet; then
            echo 'No STEP07-A evidence to commit.'
          else
            git commit -m 'Add STEP07-A failure-driven improvement evidence [skip ci]'
            git push
          fi
