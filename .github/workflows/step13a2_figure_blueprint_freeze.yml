name: step13a2-figure-blueprint-freeze

on:
  push:
    paths:
      - 'protocol/13A2/dispatch_token.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-step13a2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen 00-B environment
        run: |
          python -m pip install --upgrade pip
          pip install -r protocol/00B/requirements-lock-00b.txt
      - name: Run STEP13-A2 freeze
        run: |
          python scripts/step13a2_figure_blueprint_freeze.py
      - name: Validate renderer without drawing
        run: |
          RUN_ID="$(cat protocol/13A2/latest_run_id.txt)"
          python scripts/step13a2_figure_renderer.py --run-id "$RUN_ID" --validate-only
      - name: Commit STEP13-A2 freeze
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/runs protocol/13A2/latest_freeze_package.json protocol/13A2/latest_run_id.txt protocol/13A2/validation_record.json protocol/13A2/code_manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m '13-A2: freeze figure sources and blueprints [skip ci]'
            git push
          fi
